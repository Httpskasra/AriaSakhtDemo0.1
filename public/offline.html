<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1673ff">
    <title>تجاریس | بدون اتصال</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      main { width: min(92vw, 30rem); padding: 2rem; text-align: center; }
      .mark { width: 5rem; height: 5rem; margin: 0 auto 1.5rem; border-radius: 1.5rem; background: #1673ff; display: grid; place-items: center; color: #fff; font-size: 2rem; font-weight: 800; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p { margin: 0 auto 1.5rem; max-width: 28rem; color: #475569; line-height: 1.9; }
      button { border: 0; border-radius: .75rem; padding: .75rem 1.25rem; background: #1673ff; color: #fff; cursor: pointer; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ت</div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>برای مشاهده‌ی این صفحه، اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
